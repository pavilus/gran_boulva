<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fondatè Badge Unlock Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: radial-gradient(circle at center, #2d0057 0%, #0b0017 70%);
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  .container {
    position: relative;
    text-align: center;
  }

  .ring {
    position: absolute;
    width: 600px;
    height: 600px;
    border: 6px solid rgba(186, 85, 255, 0.3);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulseRing 2s infinite;
  }

  .ring:nth-child(2) {
    animation-delay: 0.5s;
  }

  .badge {
    width: min(420px, 78vw);
    animation:
      popIn 1s ease-out,
      floatBadge 3s ease-in-out infinite 1s,
      glowPulse 2s infinite;
    filter: drop-shadow(0 0 25px #bb66ff);
    position: relative;
    z-index: 5;
  }

  .text {
    margin-top: 25px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.2s;
    position: relative;
    z-index: 6;
  }

  .title {
    font-size: clamp(34px, 8vw, 58px);
    font-weight: 900;
    color: white;
    text-shadow: 0 0 20px #c86cff;
    letter-spacing: 2px;
  }

  .subtitle {
    margin-top: 10px;
    color: #d9b3ff;
    font-size: clamp(16px, 4vw, 24px);
  }

  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #d86fff;
    border-radius: 50%;
    animation: particles 4s linear infinite;
  }

  @keyframes popIn {
    0% {
      transform: scale(0.2) rotate(-15deg);
      opacity: 0;
    }
    70% {
      transform: scale(1.1) rotate(3deg);
      opacity: 1;
    }
    100% {
      transform: scale(1);
    }
  }

  @keyframes floatBadge {
    0%, 100% {
      transform: translateY(0px);
    }
    50% {
      transform: translateY(-12px);
    }
  }

  @keyframes glowPulse {
    0%, 100% {
      filter: drop-shadow(0 0 25px #bb66ff);
    }
    50% {
      filter: drop-shadow(0 0 60px #ff9dff);
    }
  }

  @keyframes pulseRing {
    0% {
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -50%) scale(1.5);
      opacity: 0;
    }
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes particles {
    0% {
      transform: translateY(0px) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-1000px) scale(0);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="ring"></div>
  <div class="ring"></div>

  <img src="../assets/images/fondatè.png" class="badge" alt="Fondatè Badge" />

  <div class="text">
    <div class="title">BADJ DEBLOKE!</div>
    <div class="subtitle">Ou se yon Manm Fondatè</div>
  </div>
</div>

<script>
  for (let i = 0; i < 80; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');

    particle.style.left = Math.random() * window.innerWidth + 'px';
    particle.style.top = Math.random() * window.innerHeight + 'px';
    particle.style.animationDuration = (2 + Math.random() * 3) + 's';
    particle.style.animationDelay = Math.random() * 2 + 's';

    document.body.appendChild(particle);
  }
</script>

</body>
</html>
