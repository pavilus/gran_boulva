<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>San Kanpe Badge Unlock Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #3a0c00 0%, #0b0300 72%);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      text-align: center;
      isolation: isolate;
    }

    .ring {
      position: absolute;
      width: 610px;
      height: 610px;
      border: 6px solid rgba(255, 153, 0, 0.32);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseRing 2s infinite;
    }

    .ring:nth-child(2) {
      animation-delay: 0.55s;
    }

    .fire-sweep {
      position: absolute;
      width: 680px;
      height: 680px;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: conic-gradient(from 0deg,
          transparent 0deg,
          rgba(255, 183, 0, 0.95) 35deg,
          rgba(255, 80, 0, 0.8) 55deg,
          transparent 90deg);
      filter: blur(4px);
      animation: spin 1.5s ease-out forwards;
      opacity: 0.9;
    }

    .heat {
      position: absolute;
      width: 480px;
      height: 480px;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, rgba(255, 166, 0, 0.42), rgba(255, 61, 0, 0.18) 38%, transparent 70%);
      filter: blur(12px);
      animation: heatPulse 1.8s ease-in-out infinite;
    }

    .badge {
      width: min(430px, 80vw);
      position: relative;
      z-index: 5;
      animation:
        popIn 1s ease-out,
        floatBadge 3s ease-in-out infinite 1s,
        fireGlow 1.8s infinite;
      filter: drop-shadow(0 0 28px #ff8c00);
    }

    .text {
      margin-top: 24px;
      opacity: 0;
      position: relative;
      z-index: 6;
      animation: fadeUp 1s ease forwards 1.15s;
    }

    .title {
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 900;
      color: #fff6d5;
      text-shadow: 0 0 22px #ff8c00, 0 0 42px #ff3d00;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 10px;
      color: #ffd27a;
      font-size: clamp(16px, 4vw, 24px);
    }

    .ember {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffb700;
      box-shadow: 0 0 18px #ff6500;
      animation: emberRise linear infinite;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.18) rotate(-18deg);
        opacity: 0;
      }

      70% {
        transform: scale(1.1) rotate(4deg);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes floatBadge {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes fireGlow {

      0%,
      100% {
        filter: drop-shadow(0 0 28px #ff8c00);
      }

      50% {
        filter:
          drop-shadow(0 0 48px #ffb700) drop-shadow(0 0 72px #ff3d00);
      }
    }

    @keyframes pulseRing {
      0% {
        transform: translate(-50%, -50%) scale(0.68);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes spin {
      0% {
        transform: translate(-50%, -50%) rotate(-110deg) scale(0.4);
        opacity: 0;
      }

      40% {
        opacity: 0.95;
      }

      100% {
        transform: translate(-50%, -50%) rotate(250deg) scale(1);
        opacity: 0.18;
      }
    }

    @keyframes heatPulse {

      0%,
      100% {
        opacity: 0.55;
        transform: translate(-50%, -50%) scale(0.92);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes emberRise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-920px) scale(0.1);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="fire-sweep"></div>
    <div class="heat"></div>

    <img src="../assets/images/sankanpe.png" class="badge" alt="San Kanpe Badge" />

    <div class="text">
      <div class="title">BADJ DEBLOKE!</div>
      <div class="subtitle">San Kanpe</div>
    </div>
  </div>

  <script>
    for (let i = 0; i < 70; i++) {
      const ember = document.createElement('div');
      ember.classList.add('ember');
      ember.style.left = Math.random() * window.innerWidth + 'px';
      ember.style.top = (window.innerHeight * 0.35 + Math.random() * window.innerHeight) + 'px';
      ember.style.width = (4 + Math.random() * 7) + 'px';
      ember.style.height = ember.style.width;
      ember.style.animationDuration = (1.7 + Math.random() * 2.8) + 's';
      ember.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(ember);
    }
  </script>

</body>

</html>
